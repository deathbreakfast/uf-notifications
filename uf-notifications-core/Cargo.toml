[package]
name = "uf-notifications-core"
version = "0.3.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Leptos-free notification Valence models, Photon topic, and send_notification helper"

[lints]
workspace = true

[dependencies]
valence = { workspace = true }
photon = { workspace = true, default-features = false, features = ["runtime"] }
lepton-identity = { workspace = true }
inventory.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
tracing.workspace = true
async-trait.workspace = true
futures = { version = "0.3", default-features = false, features = ["alloc"] }
anyhow.workspace = true
log.workspace = true
chrono-tz = "0.10"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

boson-core.workspace = true
boson-macros.workspace = true
boson-runtime.workspace = true
boson-valence-identity.workspace = true
quark.workspace = true
chronon-core.workspace = true
chronon-executor.workspace = true
chronon-coordinator.workspace = true
chronon-coordinator-macros.workspace = true
chronon-valence-identity.workspace = true

[features]
default = ["db-sqlite"]
db-sqlite = ["valence/sqlite"]
db-hybrid = ["valence/hybrid"]
hydrate = []
ssr = []

[dev-dependencies]
tokio = { workspace = true }

[build-dependencies]
valence-codegen = { workspace = true }
